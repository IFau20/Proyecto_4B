name: PC Tracker checks
on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Backend tests
        working-directory: backend
        run: deno task test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependencies
        working-directory: frontend
        run: npm ci
      - name: Interface tests
        working-directory: frontend
        run: npm test
      - name: Production build
        working-directory: frontend
        run: npm run build

  live_probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Probe the three retailer product pages (informational)
        working-directory: backend
        run: deno task check:live
        continue-on-error: true
      - name: Probe HP 250R across four sellers (informational)
        working-directory: backend
        run: deno task check:hp
        continue-on-error: true

  catalog_probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Audit photos, prices and stock from retailer sites (informational)
        working-directory: backend
        run: deno task audit:catalog
        continue-on-error: true
